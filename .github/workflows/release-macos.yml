name: macOS CI and Release

on:
  push:
    branches:
      - master
      - dev
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.4.0'
        required: true
        type: string
      prerelease:
        description: 'Publish as prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Verify Kimi Code Agent
    # macOS 15 supplies Xcode 16 / Swift 6 required by Package.swift.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify source
        run: npm run check && npm test

      # Build and run as separate steps: `swift run` keeps the SPM driver
      # process resident with the full build graph (several GB after compiling
      # 120 KimiAgentCore files) and then execs the checks binary, so the 8 GB
      # runner's jetsam kills the process group (exit 137). Building first lets
      # the driver exit and free memory; the binary itself peaks at ~37 MB.
      - name: Verify native core
        run: |
          cd macos
          swift build --product KimiAgentCoreChecks -Xswiftc -disable-batch-mode --jobs 1
          "$(swift build --show-bin-path)/KimiAgentCoreChecks"

      - name: Build native Kimi Code Agent targets
        run: |
          swift build --package-path macos --product KimiCodeAgent -Xswiftc -disable-batch-mode --jobs 1
          swift build --package-path macos --product KimiNativeBridge -Xswiftc -disable-batch-mode --jobs 1

      # RestartRecoveryCheck is deterministic and needs no GUI/TCC permission
      # (unlike BrowserSmokeCheck/ComputerUseSmokeCheck, which stay manual-only
      # for that reason), so it's safe to run unattended in CI. phase1 runs in
      # the background and is killed once it prints PHASE1_OK, confirming its
      # mid-flight operation's events are durably on disk — simulating an app
      # kill exactly as the tool's own comments describe. phase2 then re-opens
      # the same state directory in a fresh process and asserts the recovery
      # contract.
      - name: Verify restart recovery
        run: |
          cd macos
          swift build --product RestartRecoveryCheck -Xswiftc -disable-batch-mode --jobs 1
          BIN="$(swift build --show-bin-path)/RestartRecoveryCheck"
          STATE_DIR="$RUNNER_TEMP/restart-recovery-state"
          rm -rf "$STATE_DIR"
          "$BIN" phase1 "$STATE_DIR" > /tmp/phase1.log 2>&1 &
          PHASE1_PID=$!
          for _ in $(seq 1 50); do
            grep -q PHASE1_OK /tmp/phase1.log 2>/dev/null && break
            kill -0 "$PHASE1_PID" 2>/dev/null || { echo "phase1 exited early"; cat /tmp/phase1.log; exit 1; }
            sleep 0.2
          done
          grep -q PHASE1_OK /tmp/phase1.log || { echo "phase1 never signaled PHASE1_OK within 10s"; cat /tmp/phase1.log; kill -9 "$PHASE1_PID" 2>/dev/null; exit 1; }
          cat /tmp/phase1.log
          # The process can occasionally exit on its own between PHASE1_OK
          # being detected and this kill (observed locally with `bash: kill:
          # No such process`); that's the *intended* mid-flight-kill outcome
          # either way, so a failed kill here (already dead) must not fail
          # the step under GitHub Actions' implicit `set -e`.
          kill -9 "$PHASE1_PID" 2>/dev/null || true
          wait "$PHASE1_PID" 2>/dev/null || true
          "$BIN" phase2 "$STATE_DIR"

  release:
    name: Build and publish macOS release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      KIMI_VERSION: ${{ inputs.version || github.ref_name }}
      KIMI_DEVELOPER_ID_APPLICATION: ${{ secrets.KIMI_DEVELOPER_ID_APPLICATION }}
      KIMI_NOTARY_KEYCHAIN_PROFILE: KimiAgentNotary
      KIMI_NATIVE_VERIFY_RELEASE: '1'
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # The engine build inside the packaging script links against
      # vendor/engine workspace packages; those node_modules are gitignored
      # and must be installed first on a fresh checkout.
      - name: Install engine headless dependencies
        run: npm run engine:install

      # Distribution is GitHub-Releases-only with ad-hoc signing. Developer ID
      # certificate import and notarization are skipped unless the optional
      # secrets are configured.
      - name: Detect optional signing credentials
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$APPLE_ID" ] && \
             [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No Developer ID secrets configured; release will use ad-hoc signing (not notarized)."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.available == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PATH: ${{ runner.temp }}/kimi-agent-release.keychain-db
        run: |
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Configure notary credentials
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          KEYCHAIN_PATH: ${{ runner.temp }}/kimi-agent-release.keychain-db
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          xcrun notarytool store-credentials "$KIMI_NOTARY_KEYCHAIN_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: Verify source
        run: npm run verify

      # Sparkle's sign_update is not committed to the repo; fetch the official
      # release tarball so the packaging script can EdDSA-sign the update ZIP.
      - name: Fetch Sparkle signing tools
        run: |
          mkdir -p macos/.cache/sparkle-bin
          curl -fsSL https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz \
            -o /tmp/sparkle.tar.xz
          tar -xJf /tmp/sparkle.tar.xz -C macos/.cache/sparkle-bin
          macos/.cache/sparkle-bin/bin/sign_update --help > /dev/null

      - name: Package Kimi Code Agent release
        env:
          CSC_NAME: ${{ secrets.KIMI_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          KIMI_SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.KIMI_SPARKLE_EDDSA_PRIVATE_KEY }}
          OPENCODE_MODELS_URL: http://127.0.0.1:9
        run: |
          VERSION="${KIMI_VERSION#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "$PACKAGE_VERSION"
          npm run native:package
          shasum -a 256 release-native/Kimi-Code-Agent-"$VERSION"-mac-*.* > \
            release-native/Kimi-Code-Agent-"$VERSION"-SHA256SUMS.txt
          unzip -t release-native/Kimi-Code-Agent-"$VERSION"-mac-*.zip
          hdiutil verify release-native/Kimi-Code-Agent-"$VERSION"-mac-*.dmg

      # Publish the GitHub release BEFORE the Sparkle feed: appcast.xml points
      # at release-asset download URLs, and Sparkle clients poll master's raw
      # feed continuously. Publishing the feed first left a window where an
      # already-installed client could see the new version and 404 trying to
      # download an asset that didn't exist yet.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          VERSION="${KIMI_VERSION#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="v$VERSION"; else TAG="$GITHUB_REF_NAME"; fi
          if [ "$PRERELEASE" = "true" ]; then EXTRA="--prerelease"; else EXTRA=""; fi
          gh release create "$TAG" release-native/Kimi-Code-Agent-"$VERSION"-mac-*.dmg \
            release-native/Kimi-Code-Agent-"$VERSION"-mac-*.zip \
            release-native/Kimi-Code-Agent-"$VERSION"-SHA256SUMS.txt \
            --title "Kimi Code Agent $VERSION" \
            --generate-notes \
            $EXTRA

      # The packaging script prepends this release to appcast.xml; publish it
      # back to master because SUFeedURL reads the feed from master's raw URL.
      # By this point the GitHub release assets above already exist, so any
      # Sparkle client that sees the updated feed can download immediately.
      - name: Publish updated Sparkle feed
        run: |
          if git diff --quiet -- appcast.xml; then
            echo "appcast.xml unchanged; skipping feed publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore(appcast): add ${KIMI_VERSION} to Sparkle feed"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
